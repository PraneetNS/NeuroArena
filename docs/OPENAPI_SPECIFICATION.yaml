openapi: 3.1.0
info:
  title: NeuroArena Real-Time Matchmaking & Telemetry API
  version: 1.0.0
  description: OpenAPI 3.1 REST and WebSocket specification for NeuroArena ML Game Services.
paths:
  /healthz:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Server healthy
  /metrics:
    get:
      summary: Prometheus scrape endpoint
      responses:
        '200':
          description: Prometheus formatted system metrics
  /api/v1/leaderboard:
    get:
      summary: Fetch global leaderboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Top players sorted by ELO
  /api/ranked/profile:
    get:
      summary: Retrieve unified cross-platform player ranked profile and season metadata
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
        - name: build
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Ranked profile and active season details
  /api/ranked/match:
    post:
      summary: Process authoritative ranked 1v1 match outcome with Glicko-2 updates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerA, playerB, outcomeScoreA]
              properties:
                playerA:
                  type: object
                playerB:
                  type: object
                outcomeScoreA:
                  type: number
      responses:
        '200':
          description: Updated ratings, tier transitions, and Juice moment payloads
  /api/ranked/rollover:
    post:
      summary: Trigger season rollover with soft MMR reset and rewards disbursement
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nextSeasonId:
                  type: string
                nextSeasonName:
                  type: string
      responses:
        '200':
          description: Rollover summary and top 100 snapshot archive snapshot payload
  /api/v1/cloudsave/{userId}:
    get:
      summary: Retrieve latest cloud save revision
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User save snapshot payload
    post:
      summary: Commit new cloud save snapshot
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checksum:
                  type: string
                data:
                  type: object
  /api/telemetry/events:
    post:
      summary: Ingest single or batch telemetry events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventName:
                  type: string
                playerId:
                  type: string
                sessionId:
                  type: string
                isGuest:
                  type: boolean
                payload:
                  type: object
      responses:
        '200':
          description: Events successfully ingested
  /api/telemetry/analytics/dashboard:
    get:
      summary: Fetch executive analytics dashboard summary (Retention, FTUE Funnel, Biomes)
      responses:
        '200':
          description: Executive KPIs and cohort retention data
  /api/remote-config:
    get:
      summary: Fetch active remote configuration (5-min TTL cached)
      responses:
        '200':
          description: Active balance tuning and feature flag configuration
  /api/remote-config/publish:
    post:
      summary: Publish new balance tuning or modifier parameters (Schema v3 Validated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Configuration version published
  /api/remote-config/rollback:
    post:
      summary: One-action rollback to a previous version snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetVersion:
                  type: integer
      responses:
        '200':
          description: Configuration successfully rolled back
  /api/remote-config/history:
    get:
      summary: Fetch remote config version audit trail
      responses:
        '200':
          description: List of historical configuration snapshots
  /api/procedural/daily-seed:
    get:
      summary: Get active UTC daily challenge seed
      responses:
        '200':
          description: Standard daily seed string (DAILY-YYYYMMDD)
  /api/procedural/variant/{biomeIndex}:
    get:
      summary: Generate certified solvable procedural biome variant
      parameters:
        - name: biomeIndex
          in: path
          required: true
          schema:
            type: integer
        - name: seed
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Procedural dataset, boss move-set, and Poisson terrain layout
  /api/ranked/profile:
    get:
      summary: Get unified cross-platform player ranked profile
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Player Glicko-2 rating, tier, cosmetics, and season status
  /api/ranked/leaderboard:
    get:
      summary: Get active season Top 100 leaderboard
      responses:
        '200':
          description: Ranked players sorted by MMR
  /api/ranked/seasons/active:
    get:
      summary: Get active season metadata and days remaining
      responses:
        '200':
          description: Active season lifecycle data
  /api/ranked/seasons/{seasonId}/leaderboard:
    get:
      summary: Get historical season Top 100 snapshot archive
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Archived season leaderboard
  /api/ranked/match:
    post:
      summary: Process 1v1 ranked match outcome and return rank-up Juice triggers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated MMR ratings and visible rank transitions
  /api/ranked/rollover:
    post:
      summary: Execute season rollover, soft MMR reset, and reward disbursement
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Rollover audit and archived season snapshot
