openapi: 3.1.0
info:
  title: NeuroArena Real-Time Matchmaking & Telemetry API
  version: 1.0.0
  description: OpenAPI 3.1 REST and WebSocket specification for NeuroArena ML Game Services.
paths:
  /healthz:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Server healthy
  /metrics:
    get:
      summary: Prometheus scrape endpoint
      responses:
        '200':
          description: Prometheus formatted system metrics
  /api/v1/leaderboard:
    get:
      summary: Fetch global leaderboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Top players sorted by ELO
  /api/v1/cloudsave/{userId}:
    get:
      summary: Retrieve latest cloud save revision
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User save snapshot payload
    post:
      summary: Commit new cloud save snapshot
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checksum:
                  type: string
                data:
                  type: object
  /api/telemetry/events:
    post:
      summary: Ingest single or batch telemetry events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventName:
                  type: string
                playerId:
                  type: string
                sessionId:
                  type: string
                isGuest:
                  type: boolean
                payload:
                  type: object
      responses:
        '200':
          description: Events successfully ingested
  /api/telemetry/analytics/dashboard:
    get:
      summary: Fetch executive analytics dashboard summary (Retention, FTUE Funnel, Biomes)
      responses:
        '200':
          description: Executive KPIs and cohort retention data
  /api/remote-config:
    get:
      summary: Fetch active remote configuration (5-min TTL cached)
      responses:
        '200':
          description: Active balance tuning and feature flag configuration
  /api/remote-config/publish:
    post:
      summary: Publish new balance tuning or modifier parameters (Schema v3 Validated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Configuration version published
  /api/remote-config/rollback:
    post:
      summary: One-action rollback to a previous version snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetVersion:
                  type: integer
      responses:
        '200':
          description: Configuration successfully rolled back
  /api/remote-config/history:
    get:
      summary: Fetch remote config version audit trail
      responses:
        '200':
          description: List of historical configuration snapshots

                  type: object
      responses:
        '200':
          description: Snapshot saved successfully
