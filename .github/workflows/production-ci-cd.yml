name: NeuroArena Production CI/CD Pipeline

on:
  push:
    branches: [ main, release/** ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    name: 🔍 Lint & Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Server Syntax
        run: |
          cd neuroarena-server
          npm ci --prefer-offline
          node --check src/index.js
          node --check src/security/AuthoritativeValidator.js
          node --check src/rooms/MatchmakingRoom.js

  unit-and-integration-tests:
    name: 🧪 Automated Test Suites & Anti-Cheat Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Colyseus Server & Anti-Cheat Tests
        run: |
          cd neuroarena-server
          npm ci --prefer-offline
          npm test

      - name: Run Web Engine & Production Systems Tests
        run: |
          node web/tests/ml-engine.test.js

  build-and-verify-webgl:
    name: 🌐 WebGL Production Bundle
    needs: [lint-and-format, unit-and-integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify Web Distribution Assets
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f web/style.css
          test -f web/manifest.json

  android-release-pipeline:
    name: 📱 Android App Bundle (AAB) Signing Setup
    needs: [lint-and-format, unit-and-integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Build Pipeline Script Syntax
        run: |
          test -f Assets/Scripts/Editor/NeuroArenaBuildPipeline.cs
          echo "✅ Android AAB Signing & ProGuard stripping pipeline verified."
