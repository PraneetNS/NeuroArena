[databases]
neuroarena_prod = host=postgres-primary.database.svc.cluster.local port=5432 dbname=neuroarena_prod

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Connection Pool Limits (Multiplexing 20,000 clients -> 100 backend DB connections)
pool_mode = transaction
max_client_conn = 25000
default_pool_size = 80
min_pool_size = 20
reserve_pool_size = 20
reserve_pool_timeout = 5.0
max_db_connections = 120

# Query timeouts
server_idle_timeout = 600
client_idle_timeout = 1800
query_timeout = 30
