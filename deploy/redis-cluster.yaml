# Redis Cluster Deployment for NeuroArena Real-Time High-Scale Backend
# Keyspace Schema:
# - ranked:leaderboard:<seasonId> -> ZSET (member: accountId, score: rating)
# - ranked:profile:<accountId>    -> HASH / JSON (rating, rd, tier, cosmetics, shards)
# - daily:completed:<accountId:dateKey> -> STRING TTL 48h
# - remote:config:active          -> STRING JSON TTL 5m
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: neuroarena-prod
  labels:
    app: redis-cluster
    tier: in-memory-data-layer
spec:
  serviceName: "redis-cluster-service"
  replicas: 6
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command: ["redis-server"]
          args: ["--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: client
            - containerPort: 16379
              name: gossip
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2048Mi"
