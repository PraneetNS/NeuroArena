# Rate Limiting & Connection Bounds
limit_req_zone $binary_remote_addr zone=api_limit:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=addr_limit:20m;
limit_req_status 429;
limit_conn_status 429;

upstream neuroarena_backend_nodes {
    ip_hash; # Sticky session persistence for active WebSocket games
    server 10.0.1.10:2567 max_fails=3 fail_timeout=10s;
    server 10.0.1.11:2567 max_fails=3 fail_timeout=10s;
    server 10.0.1.12:2567 max_fails=3 fail_timeout=10s;
    keepalive 256;
}

server {
    listen 80;
    listen [::]:80;
    server_name arena.neuroarena.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arena.neuroarena.io;

    ssl_certificate /etc/letsencrypt/live/arena.neuroarena.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arena.neuroarena.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Global Connection & Buffer Limits (Anti-Slowloris / Anti-DDoS)
    limit_conn addr_limit 50;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s 30s;
    send_timeout 10s;
    client_max_body_size 10M;

    # Hardened Security Headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip & Brotli Static Content Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Procedural Biome & Ranked APIs Proxy
    location /api/ {
        proxy_pass http://neuroarena_backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # WebSocket Real-Time Gateway Proxy
    location / {
        proxy_pass http://neuroarena_backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
