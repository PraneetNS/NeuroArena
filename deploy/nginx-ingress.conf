upstream neuroarena_backend_nodes {
    ip_hash; # Sticky session persistence for active WebSocket games
    server 10.0.1.10:2567 max_fails=3 fail_timeout=10s;
    server 10.0.1.11:2567 max_fails=3 fail_timeout=10s;
    server 10.0.1.12:2567 max_fails=3 fail_timeout=10s;
    keepalive 256;
}

server {
    listen 80;
    listen [::]:80;
    server_name arena.neuroarena.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arena.neuroarena.io;

    ssl_certificate /etc/letsencrypt/live/arena.neuroarena.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arena.neuroarena.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip & Brotli Static Content Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # WebSocket Real-Time Gateway Proxy
    location / {
        proxy_pass http://neuroarena_backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
