<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroArena — In-Browser Open-World GPT Lab</title>
    <meta
      name="description"
      content="A browser-based 3D open-world game that teaches machine learning end-to-end, from data harvesting to training a tiny GPT from scratch in pure TypeScript."
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #060913;
        color: #f8fafc;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #app-canvas-container {
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
        overflow: hidden;
      }
      #app-ui-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app-canvas-container"></div>
    <div id="app-ui-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
